plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
keystoreProps.load(new FileInputStream(rootProject.file('keystore/keystore.properties')))

android {
    namespace 'com.amarullz.androidtv.animetvjmto'
    compileSdk 35

    defaultConfig {
        applicationId "org.tenchirock.animetv"
        minSdk 22
        targetSdk 34
        versionCode 673
        versionName "6.7.4-Nightly"

        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
    }

    /* Deux variantes :
       - legacy : minSdk 22 (anciens devices), targetSdk 34, media3 1.4.1
       - modern : minSdk 26, targetSdk 35, media3 1.5.1 + nouvelles APIs
       Meme applicationId + meme signature : interchangeables a l'install. */
    flavorDimensions "api"
    productFlavors {
        legacy {
            dimension "api"
            minSdk 22
            targetSdk 34
        }
        modern {
            dimension "api"
            minSdk 26
            targetSdk 35
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "animetv-" + variant.versionName + "-" + variant.flavorName + ".apk"
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/release.keystore')
            storePassword keystoreProps['storePassword']
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            /* Meme certificat partout : identite unique (local + CI + maj) */
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
    }
    lint {
        /* Les API recentes sont gardees par flavor/runtime checks */
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.media:media:1.7.0'

    // Lecteur video : media3 1.4.1 (legacy) / 1.5.1 (modern)
    legacyImplementation 'androidx.media3:media3-exoplayer:1.4.1'
    legacyImplementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    legacyImplementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    legacyImplementation 'androidx.media3:media3-ui:1.4.1'

    modernImplementation 'androidx.media3:media3-exoplayer:1.5.1'
    modernImplementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    modernImplementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    modernImplementation 'androidx.media3:media3-ui:1.5.1'

    // Chaines ecran d'accueil Android TV
    implementation 'androidx.tvprovider:tvprovider:1.1.0'

    // Moteur HTTP (OkHttp + DNS-over-HTTPS + Cronet)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.google.android.gms:play-services-cronet:18.1.0'
}
