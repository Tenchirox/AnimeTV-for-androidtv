name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animetv-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Read version name
        id: ver
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --title "AnimeTV ${{ steps.ver.outputs.version }}" \
            --notes "Build automatique depuis master (commit ${{ github.sha }})." \
            --latest
